services:
  - type: web
    name: circularity-agent-live-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn demo.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: RUNS_DIR
        value: runs
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_REPLAY_SPEED
        value: "4"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_2_API_KEY
        sync: false
      - key: GEMINI_3_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_2_API_KEY
        sync: false
      - key: NVIDIA_3_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_2_API_KEY
        sync: false
      - key: OPENROUTER_3_API_KEY
        sync: false
      - key: OPENROUTER_4_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SELLER_LLM_CHAIN
        value: "gemini:gemini-3.1-flash-lite,gemini_2:gemini-3.1-flash-lite,gemini_3:gemini-3.1-flash-lite,nvidia:deepseek-ai/deepseek-v4-flash-0731"
      - key: BUYER_1_LLM_CHAIN
        value: "gemini_2:gemini-3.1-flash-lite,gemini_3:gemini-3.1-flash-lite,nvidia_2:deepseek-ai/deepseek-v4-flash-0731"
      - key: BUYER_2_LLM_CHAIN
        value: "gemini_3:gemini-3.1-flash-lite,gemini_2:gemini-3.1-flash-lite,nvidia_3:deepseek-ai/deepseek-v4-flash-0731"
      - key: BUYER_3_LLM_CHAIN
        value: "gemini:gemini-3.1-flash-lite,gemini_3:gemini-3.1-flash-lite,nvidia:deepseek-ai/deepseek-v4-flash-0731"
      - key: GEMINI_REASONING_EFFORT
        value: low
      - key: GEMINI_RPM
        value: "gemini-3.1-flash-lite:14,gemini-3.5-flash:4,gemini-3-flash-preview:4"
      - key: GEMINI_RPD
        value: "gemini-3.1-flash-lite:480,gemini-3.5-flash:18,gemini-3-flash-preview:18"
      - key: GEMINI_QUOTA_SCOPE
        value: project
      - key: NVIDIA_RPM
        value: "40"
      - key: GEMINI_TIMEOUT_S
        value: "12"
      - key: NVIDIA_TIMEOUT_S
        value: "8"
      - key: OPENROUTER_RPM
        value: "20"
      - key: OPENROUTER_RPD
        value: "50"
