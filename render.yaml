services:
  - type: web
    name: circularity-agent-live-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn demo.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: RUNS_DIR
        value: runs
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_REPLAY_SPEED
        value: "4"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
